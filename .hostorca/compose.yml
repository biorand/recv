# Deployment for hostorca: describes the service, not the instance.
#
# The agent connects to a BioRand API and waits for randomizers to generate.
# The endpoint, API key and input ISO are instance values: they arrive from
# the environment, never from this file.
services:
  agent:
    build:
      dockerfile: Dockerfile
    command: sh -c 'exec biorand-recv agent "$$AGENT_ENDPOINT" -k "$$AGENT_KEY" -i "$$AGENT_DATA"'
    environment:
      AGENT_ENDPOINT: ${AGENT_ENDPOINT}
      AGENT_KEY: ${AGENT_KEY}
      AGENT_DATA: ${AGENT_DATA}
    volumes:
      - ./.biorand:/root/.biorand
    restart: unless-stopped
